version: "3.8"

services:
  forensics-db:
    image: postgis/postgis:16-3.4
    container_name: roadlens-forensics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: roadlens_forensics
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  forensics-api:
    build:
      context: .
      dockerfile: forensics/Dockerfile
    container_name: roadlens-forensics-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@forensics-db:5432/roadlens_forensics
      SPEED_LIMIT_KMH: 50.0
      TIMEZONE: Asia/Kolkata
    ports:
      - "8000:8000"
    depends_on:
      forensics-db:
        condition: service_healthy

volumes:
  postgis_data:
